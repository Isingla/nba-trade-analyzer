# =============================================================================
# NBA CBA SALARY REFERENCE — 2025-26 league year
# =============================================================================
# Purpose: the single source of truth the cba-auditor checks the engine against.
# This file is only as trustworthy as its `verified` flags. Read this before use:
#
#   verified: true   -> value comes from a PRIMARY source (NBA league announcement)
#                       or is trivially derivable from one. Safe to audit against.
#   verified: false  -> value is secondary-sourced, conflicts across sources, or is
#                       bracket/threshold logic that is easy to get subtly wrong.
#                       The auditor must treat engine values measured against these
#                       as UNVERIFIED, never "correct", until you confirm them.
#
# `action: VERIFY ...` tells you exactly what to confirm and where. The stated
# authority for this project is cbaguide.com (what the engine was built against),
# so where a value is flagged, confirm it THERE, then flip verified -> true.
#
# Numbers are in whole US dollars. Do NOT let the auditor invent or "estimate"
# any value in here — a missing number stays null + VERIFY, it does not get guessed.
# =============================================================================

meta:
  season: "2025-26"
  cba_term: "2023 CBA (in effect 2023-2030)"
  last_updated: "2026-06-11"   # cbaguide ratification pass (trade_matching, apron timing/triggers, BAE)
  primary_source: "https://pr.nba.com/nba-salary-cap-2025-26-season"
  note_2026_27: >
    The official 2026-27 cap levels were announced by the league in June 2026 and
    are entered below as `cap_levels_2026_27` (verified, primary-sourced from the
    NBA.com league press release). The original rule stands for every LATER year:
    do NOT populate a season block with projections and treat them as verified —
    projected out-year levels live ONLY in engine/constants.py
    (CAP_THRESHOLDS_BY_SEASON), explicitly tagged certified=False.

