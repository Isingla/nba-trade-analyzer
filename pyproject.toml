[project]
name = "nba-trade-analyzer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ishaan Singla", email = "cheif.ishaan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "nba-api>=1.11.4",
    "pandas>=3.0.3",
    "pip-system-certs>=5.3",
    "pydantic>=2.13.4",
]

[project.scripts]
nba-trade-analyzer = "nba_trade_analyzer:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]
